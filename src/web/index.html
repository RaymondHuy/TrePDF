<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>TrePDF Web</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #faf9f6; }
    body { font: 16px/1.5 system-ui, sans-serif; color: #25362c; }
    #screen { width: 100%; height: 100%; display: none; }
    #loading { box-sizing: border-box; height: 100%; display: grid; place-content: center; padding: 24px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    #status { max-width: 520px; margin: 0; color: #626962; }
  </style>
</head>
<body>
  <main id="loading" aria-live="polite">
    <h1>TrePDF Web</h1>
    <p id="status">Loading the PDF viewer…</p>
    <noscript>Enable JavaScript to open PDF files in this browser.</noscript>
  </main>
  <div id="screen" aria-label="TrePDF viewer"></div>
  <script src="trepdf_web.js"></script>
  <script src="qtloader.js"></script>
  <script>
    (async () => {
      const loading = document.getElementById('loading');
      const screen = document.getElementById('screen');
      const status = document.getElementById('status');
      const showError = message => {
        screen.style.display = 'none';
        loading.style.display = 'grid';
        status.textContent = message;
      };
      if (location.protocol === 'file:') {
        showError('Serve this folder over HTTP or HTTPS. See START-HERE.txt for the local command.');
        return;
      }
      try {
        await qtLoad({
          qt: {
            entryFunction: window.trepdf_web_entry,
            containerElements: [screen],
            onLoaded: () => {
              loading.style.display = 'none';
              screen.style.display = 'block';
            },
            onExit: () => showError('The viewer stopped. Reload this page to open your PDF again.')
          }
        });
      } catch (error) {
        console.error('TrePDF startup:', error);
        showError('The viewer could not start. Check your connection and use a browser with WebAssembly and WebGL 2 enabled, then reload.');
      }
    })();
  </script>
</body>
</html>
