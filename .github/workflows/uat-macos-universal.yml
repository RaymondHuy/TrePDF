name: uat-macos-universal
run-name: uat-macos-universal 0.0.${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TREPDF_VERSION: 0.0.${{ github.run_number }}
  TREPDF_PLATFORM: macos-universal
  TREPDF_PACKAGE: macos-universal-qt6.11
  QT_VERSION: '6.11.0'
  MACOS_DEPLOYMENT_TARGET: '13.0'

defaults:
  run:
    shell: bash

jobs:
  dependencies:
    name: Dependencies (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            arch: arm64
          - platform: macos-x64
            os: macos-15-intel
            arch: x86_64
    env:
      MACOS_ARCHITECTURE: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install 'cmake==3.31.6' 'ninja==1.11.1.3'

      - name: Check packaging helpers
        run: python -m unittest discover -s scripts/ci/tests -p 'test_*.py'

      - name: Prepare native PDF and OCR dependencies
        env:
          DEPENDENCY_PLATFORM: ${{ matrix.platform }}
        run: |
          python scripts/ci/prepare_dependencies.py \
            --platform "$DEPENDENCY_PLATFORM" --directory _deps/uat
          python scripts/ci/macos_universal.py pack \
            --dependencies _deps/uat --output "deps-$DEPENDENCY_PLATFORM.tar.gz"

      - name: Transfer dependency slice
        # The tar carries just the build inputs and their notices.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: internal-deps-${{ matrix.platform }}
          path: deps-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  build:
    name: Build Universal (Qt 6.11)
    needs: dependencies
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build and DMG tools
        run: |
          python -m pip install 'cmake==3.31.6' 'ninja==1.11.1.3'
          python -m pip install -r scripts/ci/requirements-macos-dmg.txt

      - name: Install Qt 6.11 universal SDK
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtshadertools qtimageformats qttasktree
          aqtversion: '==3.3.0'
          cache: true
          install-deps: false

      - name: Download dependency slices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: internal-deps-*
          path: incoming
          merge-multiple: true

      - name: Merge universal dependencies
        run: |
          mkdir -p _deps/slices/arm64 _deps/slices/x64
          tar -xzf incoming/deps-macos-arm64.tar.gz -C _deps/slices/arm64
          tar -xzf incoming/deps-macos-x64.tar.gz -C _deps/slices/x64
          python scripts/ci/macos_universal.py merge \
            --arm64 _deps/slices/arm64 --x64 _deps/slices/x64 --output _deps/universal

      - name: Configure Universal Release
        run: |
          cmake -S . -B build/universal -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DTREPDF_DEPLOY_RUNTIME=ON \
            "-DTREPDF_VERSION=$TREPDF_VERSION" \
            "-DQt6_DIR=$QT_ROOT_DIR/lib/cmake/Qt6" \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            "-DPDFium_ROOT=$PDFium_ROOT" \
            "-DQPDF_ROOT=$QPDF_ROOT" \
            "-DOCR_ROOT=$OCR_ROOT" \
            -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_LIBDIR=lib \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            "-DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOS_DEPLOYMENT_TARGET"

      - name: Build
        run: cmake --build build/universal --target trepdf --parallel 3

      - name: Deploy universal runtime
        run: |
          cmake --install build/universal --config Release \
            --prefix "$PWD/build/stage/TrePDF-$TREPDF_VERSION-$TREPDF_PACKAGE"

      - name: Verify both slices, sign, package and test on Apple Silicon
        # Checks every bundled Mach-O, then signs the final bundle and smoke-tests
        # the extracted ZIP on this native arm64 runner. DMG keeps the Finder layout.
        run: |
          python scripts/ci/package_uat.py \
            --platform "$TREPDF_PLATFORM" --version "$TREPDF_VERSION" --variant qt6.11 \
            --stage "build/stage/TrePDF-$TREPDF_VERSION-$TREPDF_PACKAGE" \
            --dependencies _deps/universal --output artifacts --macos-dmg

      - name: Transfer candidate packages for Intel verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: internal-macos-universal-candidate
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  verify-intel:
    name: Test on Intel and upload Universal downloads
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download candidate packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: internal-macos-universal-candidate
          path: artifacts

      - name: Verify downloaded checksums
        working-directory: artifacts
        run: shasum -a 256 -c ./*.sha256

      - name: Check the extracted app on native Intel
        run: |
          ditto -x -k "artifacts/TrePDF-$TREPDF_VERSION-$TREPDF_PACKAGE.zip" restored
          python - <<'PY'
          import os
          import platform
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts/ci")
          from package_uat import smoke_test, verify_macos_bundle

          if platform.machine() != "x86_64":
              raise RuntimeError("This check requires a native Intel runner")
          app = Path("restored") / (
              f"TrePDF-{os.environ['TREPDF_VERSION']}-{os.environ['TREPDF_PACKAGE']}"
          ) / "trepdf.app"
          verify_macos_bundle(app)
          smoke_test(app.resolve() / "Contents/MacOS/trepdf", "macos-universal")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("Universal package: native Intel startup check passed.\n")
          PY

      - name: Upload DMG directly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/TrePDF-${{ env.TREPDF_VERSION }}-${{ env.TREPDF_PACKAGE }}.dmg
          archive: false
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload DMG checksum directly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/TrePDF-${{ env.TREPDF_VERSION }}-${{ env.TREPDF_PACKAGE }}.dmg.sha256
          archive: false
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload ZIP and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrePDF-${{ env.TREPDF_VERSION }}-${{ env.TREPDF_PACKAGE }}
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true
