name: Tre PDF UAT - macOS Universal
run-name: Tre PDF UAT - macOS Universal (Qt ${{ inputs.qt }}) ${{ inputs.version || format('0.0.{0}', github.run_number) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 1.2.3). Leave blank for 0.0.<run number>.'
        type: string
        required: false
      qt:
        description: 'Qt series (choose all for three installers)'
        type: choice
        required: true
        default: '6.11'
        options:
          - '6.11'
          - '6.8'
          - '6.12'
          - all

permissions:
  contents: read

jobs:
  qt-6-8:
    name: Qt 6.8
    if: inputs.qt == '6.8' || inputs.qt == 'all'
    uses: ./.github/workflows/build-macos-universal.yml
    with:
      version: ${{ inputs.version }}
      variant: qt6.8
      qt-version: '6.8.3'
      macos-target: '12.0'
    secrets: &macos-signing
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

  qt-6-11:
    name: Qt 6.11
    if: inputs.qt == '6.11' || inputs.qt == 'all'
    uses: ./.github/workflows/build-macos-universal.yml
    with:
      version: ${{ inputs.version }}
      variant: qt6.11
      qt-version: '6.11.0'
      macos-target: '13.0'
    secrets: *macos-signing

  qt-6-12:
    name: Qt 6.12
    if: inputs.qt == '6.12' || inputs.qt == 'all'
    uses: ./.github/workflows/build-macos-universal.yml
    with:
      version: ${{ inputs.version }}
      variant: qt6.12
      qt-version: '6.12.0'
      macos-target: '14.4'
    secrets: *macos-signing
