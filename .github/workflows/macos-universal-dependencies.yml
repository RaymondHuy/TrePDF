name: Prepare macOS Universal dependencies

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      variant:
        type: string
        required: true
      macos-target:
        type: string
        required: true

permissions:
  contents: read

env:
  TREPDF_VERSION: ${{ inputs.version || format('0.0.{0}', github.run_number) }}
  MACOS_DEPLOYMENT_TARGET: ${{ inputs.macos-target }}

defaults:
  run:
    shell: bash

jobs:
  dependencies:
    name: Dependencies (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            arch: arm64
          - platform: macos-x64
            os: macos-15-intel
            arch: x86_64
    env:
      MACOS_ARCHITECTURE: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate app version
        shell: bash
        run: python scripts/ci/app_version.py --version="$TREPDF_VERSION"

      - name: Install build tools
        run: python -m pip install 'cmake==3.31.6' 'ninja==1.11.1.3'

      - name: Check packaging helpers
        run: python -m unittest discover -s scripts/ci/tests -p 'test_*.py'

      - name: Prepare native PDF and OCR dependencies
        env:
          DEPENDENCY_PLATFORM: ${{ matrix.platform }}
        run: |
          python scripts/ci/prepare_dependencies.py \
            --platform "$DEPENDENCY_PLATFORM" --directory _deps/uat
          python scripts/ci/macos_universal.py pack \
            --dependencies _deps/uat --output "deps-$DEPENDENCY_PLATFORM.tar.gz"

      - name: Transfer dependency slice
        # The tar carries just the build inputs and their notices.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: internal-deps-${{ inputs.variant }}-${{ matrix.platform }}
          path: deps-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
