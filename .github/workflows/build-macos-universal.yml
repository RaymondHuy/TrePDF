name: Build macOS Universal package

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      variant:
        type: string
        required: true
      qt-version:
        type: string
        required: true
      macos-target:
        type: string
        required: true
    secrets:
      APPLE_CERTIFICATE_BASE64:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_API_KEY_BASE64:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER_ID:
        required: true

permissions:
  contents: read

env:
  TREPDF_VERSION: ${{ inputs.version || format('0.0.{0}', github.run_number) }}
  TREPDF_PLATFORM: macos-universal
  TREPDF_PACKAGE: macos-universal-${{ inputs.variant }}
  TREPDF_VARIANT: ${{ inputs.variant }}
  QT_VERSION: ${{ inputs.qt-version }}
  MACOS_DEPLOYMENT_TARGET: ${{ inputs.macos-target }}

defaults:
  run:
    shell: bash

jobs:
  dependencies:
    uses: ./.github/workflows/macos-universal-dependencies.yml
    with:
      version: ${{ inputs.version }}
      variant: ${{ inputs.variant }}
      macos-target: ${{ inputs.macos-target }}

  build:
    name: Build Universal (Qt ${{ inputs.qt-version }})
    needs: dependencies
    runs-on: macos-15
    timeout-minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build and DMG tools
        run: |
          python -m pip install 'cmake==3.31.6' 'ninja==1.11.1.3'
          python -m pip install -r scripts/ci/requirements-macos-dmg.txt

      - name: Install Qt ${{ inputs.qt-version }} universal SDK
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: ${{ inputs.variant == 'qt6.8' && 'qtshadertools qtimageformats' || 'qtshadertools qtimageformats qttasktree' }}
          aqtversion: '==3.3.0'
          cache: true
          install-deps: false

      - name: Download dependency slices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: internal-deps-${{ inputs.variant }}-*
          path: incoming
          merge-multiple: true

      - name: Merge universal dependencies
        run: |
          mkdir -p _deps/slices/arm64 _deps/slices/x64
          tar -xzf incoming/deps-macos-arm64.tar.gz -C _deps/slices/arm64
          tar -xzf incoming/deps-macos-x64.tar.gz -C _deps/slices/x64
          python scripts/ci/macos_universal.py merge \
            --arm64 _deps/slices/arm64 --x64 _deps/slices/x64 --output _deps/universal

      - name: Configure Universal Release
        run: |
          cmake -S . -B build/universal -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DTREPDF_DEPLOY_RUNTIME=ON \
            "-DTREPDF_VERSION=$TREPDF_VERSION" \
            "-DQt6_DIR=$QT_ROOT_DIR/lib/cmake/Qt6" \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            "-DPDFium_ROOT=$PDFium_ROOT" \
            "-DQPDF_ROOT=$QPDF_ROOT" \
            "-DOCR_ROOT=$OCR_ROOT" \
            -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_LIBDIR=lib \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            "-DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOS_DEPLOYMENT_TARGET"

      - name: Build
        run: cmake --build build/universal --target trepdf --parallel 3

      - name: Deploy universal runtime
        run: |
          cmake --install build/universal --config Release \
            --prefix "$PWD/build/stage/TrePDF-$TREPDF_VERSION-$TREPDF_PACKAGE"

      - name: Verify Tre PDF app name, sign and notarize Universal downloads
        # Checks every bundled Mach-O, then signs the final bundle and smoke-tests
        # the extracted ZIP on this native arm64 runner. DMG keeps the Finder layout.
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          python scripts/ci/package_uat.py \
            --platform "$TREPDF_PLATFORM" --version "$TREPDF_VERSION" --variant "$TREPDF_VARIANT" \
            --stage "build/stage/TrePDF-$TREPDF_VERSION-$TREPDF_PACKAGE" \
            --dependencies _deps/universal --output artifacts --macos-dmg --macos-notarize

      - name: Transfer candidate packages for Intel verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: internal-macos-universal-candidate-${{ inputs.variant }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  verify-intel:
    name: Test on Intel and upload Universal downloads
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download candidate packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: internal-macos-universal-candidate-${{ inputs.variant }}
          path: artifacts

      - name: Verify downloaded checksums
        working-directory: artifacts
        run: shasum -a 256 -c ./*.sha256

      - name: Check the extracted app on native Intel
        run: |
          ditto -x -k "artifacts/TrePDF-$TREPDF_VERSION-$TREPDF_PACKAGE.zip" restored
          python - <<'PY'
          import os
          import platform
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts/ci")
          from package_uat import smoke_test, verify_macos_bundle

          if platform.machine() != "x86_64":
              raise RuntimeError("This check requires a native Intel runner")
          app = Path("restored") / (
              f"TrePDF-{os.environ['TREPDF_VERSION']}-{os.environ['TREPDF_PACKAGE']}"
          ) / "Tre PDF.app"
          verify_macos_bundle(app)
          smoke_test(app.resolve() / "Contents/MacOS/Tre PDF", "macos-universal")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("Universal package: native Intel startup check passed.\n")
          PY

      - name: Upload DMG directly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/TrePDF-${{ env.TREPDF_VERSION }}-${{ env.TREPDF_PACKAGE }}.dmg
          archive: false
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload DMG checksum directly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/TrePDF-${{ env.TREPDF_VERSION }}-${{ env.TREPDF_PACKAGE }}.dmg.sha256
          archive: false
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload ZIP and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tre PDF-${{ env.TREPDF_VERSION }}-${{ env.TREPDF_PACKAGE }}
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true
