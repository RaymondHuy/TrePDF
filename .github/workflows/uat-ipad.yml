name: uat-ipad
run-name: uat-ipad 0.0.${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'Unsigned archive or signed IPA (requires IOS_* secrets)'
        type: choice
        default: unsigned
        options:
          - unsigned
          - development
          - ad-hoc
          - app-store-connect
      bundle_id:
        description: 'Explicit bundle ID matching your provisioning profile'
        type: string
        default: com.treoffice.trepdf
        required: true

permissions:
  contents: read

jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TREPDF_VERSION: 0.0.${{ github.run_number }}
      QT_VERSION: '6.12.0'
      SIGNING_METHOD: ${{ inputs.signing }}
      BUNDLE_ID: ${{ inputs.bundle_id }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install 'cmake==3.31.6' 'ninja==1.11.1.3' 'aqtinstall==3.3.0'
      - name: Validate signing profile rules
        run: python -m unittest discover -s scripts/ci/tests -v
      - name: Install Qt host tools and iOS kit
        run: |
          python -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -O "$RUNNER_TEMP/Qt" -m qtshadertools qttasktree
          python -m aqt install-qt mac ios "$QT_VERSION" ios -O "$RUNNER_TEMP/Qt" -m qtshadertools qtimageformats qttasktree
      - name: Prepare iOS PDF dependencies
        run: python scripts/ci/prepare_ios_dependencies.py --platform ios-device-arm64 --directory _deps/ios/device
      - name: Build archive and export package
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          python scripts/ci/build_ios.py \
            --qt-ios "$RUNNER_TEMP/Qt/$QT_VERSION/ios" \
            --qt-host "$RUNNER_TEMP/Qt/$QT_VERSION/macos" \
            --dependencies _deps/ios/device \
            --version "$TREPDF_VERSION" --bundle-id "$BUNDLE_ID" \
            --signing "$SIGNING_METHOD" --output artifacts/ipad
      - name: Upload iPad package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrePDF-${{ env.TREPDF_VERSION }}-ipad-${{ inputs.signing }}
          path: artifacts/ipad/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
