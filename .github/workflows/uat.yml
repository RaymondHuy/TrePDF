name: uat
run-name: uat 0.0.${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A new manual run increments x; re-running that run retains its version.
  TREPDF_VERSION: 0.0.${{ github.run_number }}
  QT_VERSION: '6.10.3'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            qt-arch: win64_msvc2022_64
          - platform: macos-arm64
            os: macos-15
            qt-arch: clang_64
          - platform: linux-x64
            os: ubuntu-24.04
            qt-arch: linux_gcc_64
    defaults:
      run:
        shell: bash
    env:
      TREPDF_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up MSVC x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64

      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 \
            libjpeg-dev zlib1g-dev patchelf

      - name: Install build tools
        run: python -m pip install 'cmake==3.31.6' 'ninja==1.11.1.3'

      - name: Install Qt
        # Call the pinned implementation directly; the composite wrapper uses a floating @v4.
        uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          modules: qtshadertools qtimageformats
          cache: true
          install-deps: false

      - name: Prepare native PDF dependencies
        run: |
          python scripts/ci/prepare_dependencies.py \
            --platform "$TREPDF_PLATFORM" --directory _deps/uat

      - name: Configure Release
        run: |
          options=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            options+=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0)
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            options+=(-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl "-DZLIB_ROOT=$ZLIB_ROOT")
          fi
          cmake -S . -B build/uat -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DTREPDF_DEPLOY_RUNTIME=ON \
            "-DTREPDF_VERSION=$TREPDF_VERSION" \
            "-DQt6_DIR=$QT_ROOT_DIR/lib/cmake/Qt6" \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            "-DPDFium_ROOT=$PDFium_ROOT" \
            "-DQPDF_ROOT=$QPDF_ROOT" \
            -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_LIBDIR=lib \
            "${options[@]}"

      - name: Build
        run: cmake --build build/uat --target trepdf --parallel 3

      - name: Deploy runtime
        run: |
          cmake --install build/uat --config Release \
            --prefix "$PWD/build/stage/TrePDF-$TREPDF_VERSION-$TREPDF_PLATFORM"

      - name: Verify and package
        run: |
          python scripts/ci/package_uat.py \
            --platform "$TREPDF_PLATFORM" --version "$TREPDF_VERSION" \
            --stage "build/stage/TrePDF-$TREPDF_VERSION-$TREPDF_PLATFORM" \
            --dependencies _deps/uat --output artifacts

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TrePDF-${{ env.TREPDF_VERSION }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
