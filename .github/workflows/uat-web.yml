name: uat-web
run-name: uat-web 0.0.${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # This manual workflow has its own version counter, independent of desktop UAT.
  TREPDF_VERSION: 0.0.${{ github.run_number }}
  QT_VERSION: '6.12.0'
  EMSCRIPTEN_VERSION: '5.0.5'

jobs:
  build:
    name: web-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tools and host runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libfontconfig1
          python -m pip install 'cmake==3.31.6' 'ninja==1.11.1.3' 'aqtinstall==3.3.0'

      - name: Install Qt host tools and WebAssembly
        run: |
          python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt" --archives qtbase qtdeclarative qtsvg qttools \
            --modules qtshadertools
          python -m aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread \
            --outputdir "$RUNNER_TEMP/Qt" --archives qtbase qtdeclarative qtsvg \
            --modules qtshadertools

      - name: Checkout pinned Emscripten SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emscripten-core/emsdk
          ref: c9ef2c9d6000341d667a32a807ba47ca489d1e1b # 5.0.5
          path: _toolchain/emsdk
          persist-credentials: false

      - name: Install Emscripten
        run: |
          ./_toolchain/emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          ./_toolchain/emsdk/emsdk activate "$EMSCRIPTEN_VERSION"

      - name: Prepare PDFium WebAssembly
        run: python scripts/ci/prepare_web_dependencies.py --directory _deps/web

      - name: Test PDF worker and browser bridge
        run: |
          source _toolchain/emsdk/emsdk_env.sh
          node scripts/ci/tests/test_web_pdfium.mjs _deps/web/pdfium/lib
          node scripts/ci/tests/test_web_edit_pdfium.mjs _deps/web/pdfium/lib
          node scripts/ci/tests/test_web_source_pdfium.mjs _deps/web/pdfium/lib
          node --test scripts/ci/tests/test_web_bridge.mjs

      - name: Build and package website
        run: |
          source _toolchain/emsdk/emsdk_env.sh
          python scripts/ci/build_web.py \
            --qt-cmake "$RUNNER_TEMP/Qt/$QT_VERSION/wasm_singlethread/bin/qt-cmake" \
            --qt-host-path "$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" \
            --dependencies _deps/web --build build/web --stage build/web-site \
            --output artifacts/web --version "$TREPDF_VERSION"

      - name: Test packaged viewer in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-save --ignore-scripts 'playwright@1.62.1' 'pngjs@7.0.0'
          node "$RUNNER_TEMP/browser-tests/node_modules/playwright/cli.js" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/browser-tests/node_modules" \
            node scripts/ci/tests/test_web_browser.cjs build/web-site

      - name: Upload website package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrePDF-${{ env.TREPDF_VERSION }}-web-wasm
          path: artifacts/web/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
