name: uat-macos-intel
run-name: uat-macos-intel 0.0.${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Run numbers belong to this workflow; re-running a run retains its version.
  TREPDF_VERSION: 0.0.${{ github.run_number }}

jobs:
  build:
    name: ${{ matrix.package || matrix.platform }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x64
            qt-version: '6.12.0'
            macos-target: '14.4'
          - platform: macos-x64
            package: macos-x64-qt6.11
            variant: qt6.11
            qt-version: '6.11.0'
            macos-target: '13.0'
    defaults:
      run:
        shell: bash
    env:
      TREPDF_PLATFORM: ${{ matrix.platform }}
      TREPDF_PACKAGE: ${{ matrix.package || matrix.platform }}
      TREPDF_VARIANT: ${{ matrix.variant }}
      QT_VERSION: ${{ matrix.qt-version }}
      MACOS_ARCHITECTURE: x86_64
      MACOS_DEPLOYMENT_TARGET: ${{ matrix.macos-target }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install 'cmake==3.31.6' 'ninja==1.11.1.3'

      - name: Install Qt
        # Call the pinned implementation directly to use the Python version configured above.
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtshadertools qtimageformats qttasktree
          aqtversion: '==3.3.0'
          cache: true
          install-deps: false

      - name: Prepare native PDF dependencies
        run: |
          python scripts/ci/prepare_dependencies.py \
            --platform "$TREPDF_PLATFORM" --directory _deps/uat

      - name: Configure Release
        run: |
          cmake -S . -B build/uat -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DTREPDF_DEPLOY_RUNTIME=ON \
            "-DTREPDF_VERSION=$TREPDF_VERSION" \
            "-DQt6_DIR=$QT_ROOT_DIR/lib/cmake/Qt6" \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            "-DPDFium_ROOT=$PDFium_ROOT" \
            "-DQPDF_ROOT=$QPDF_ROOT" \
            "-DOCR_ROOT=$OCR_ROOT" \
            -DCMAKE_INSTALL_BINDIR=bin -DCMAKE_INSTALL_LIBDIR=lib \
            "-DCMAKE_OSX_ARCHITECTURES=$MACOS_ARCHITECTURE" \
            "-DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOS_DEPLOYMENT_TARGET"

      - name: Build
        run: cmake --build build/uat --target trepdf --parallel 3

      - name: Deploy runtime
        run: |
          cmake --install build/uat --config Release \
            --prefix "$PWD/build/stage/TrePDF-$TREPDF_VERSION-$TREPDF_PACKAGE"

      - name: Verify and package
        run: |
          python scripts/ci/package_uat.py \
            --platform "$TREPDF_PLATFORM" --version "$TREPDF_VERSION" \
            --variant "$TREPDF_VARIANT" \
            --stage "build/stage/TrePDF-$TREPDF_VERSION-$TREPDF_PACKAGE" \
            --dependencies _deps/uat --output artifacts

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrePDF-${{ env.TREPDF_VERSION }}-${{ env.TREPDF_PACKAGE }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
